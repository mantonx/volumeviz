version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "mantonx"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # Security patches (highest priority)
      security-patches:
        patterns:
          - "*"
        update-types:
          - "security"
      # Safe core libraries (patch & minor)
      core-safe-updates:
        patterns:
          - "github.com/gin-gonic/gin"
          - "github.com/gorilla/websocket"
          - "github.com/lib/pq" 
          - "github.com/google/uuid"
          - "github.com/stretchr/testify"
        update-types:
          - "minor"
          - "patch"
      # Docker SDK (patch only - breaking changes common)
      docker-sdk:
        patterns:
          - "github.com/docker/docker"
          - "github.com/testcontainers/*"
        update-types:
          - "patch"
      # Development tools (more permissive)
      dev-tools:
        patterns:
          - "github.com/golangci/golangci-lint"
          - "github.com/swaggo/*"
        update-types:
          - "minor"
          - "patch"
      # Other patches
      other-patches:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Frontend npm packages
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly" 
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 10
    reviewers:
      - "mantonx"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday" 
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "mantonx"
    commit-message:
      prefix: "build"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 5
    reviewers:
      - "mantonx"  
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-updates:
        patterns:
          - "*"