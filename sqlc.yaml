version: '2'
sql:
  - engine: 'postgresql'
    queries: 'internal/repo/queries-postgresql'
    schema: 
      - 'migrations/postgresql/000001_initial_schema.up.sql'
      - 'migrations/postgresql/000002_add_user_authentication.up.sql'
      - 'migrations/postgresql/000002_add_multitenancy.up.sql'
    gen:
      go:
        package: 'sqlc'
        out: 'internal/db/sqlc'
        sql_package: 'pgx/v5'
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_exact_table_names: true
        emit_empty_slices: true
        emit_all_enum_values: true
        overrides:
          - column: '*.path_hash'
            go_type:
              type: '[]byte'
          - column: '*.hdr_format'
            go_type:
              type: 'string'
          - column: '*.created_at'
            go_type:
              type: 'time.Time'
          - column: '*.updated_at'
            go_type:
              type: 'time.Time'
          - column: '*.mtime'
            go_type:
              type: 'time.Time'
          - column: '*.ctime'
            go_type:
              type: 'time.Time'
          - column: '*.computed_at'
            go_type:
              type: 'time.Time'
          - column: '*.snapshot_date'
            go_type:
              type: 'time.Time'
          - column: '*.mount_type'
            go_type:
              type: 'string'
          - column: '*.access_mode'
            go_type:
              type: 'string'
          - column: '*.action'
            go_type:
              type: 'string'
          - column: '*.operator'
            go_type:
              type: 'string'
          - column: '*.status'
            go_type:
              type: 'string'
