  /volumes:
    get:
      description: Get paginated list of Docker volumes with filtering, sorting, and
        search capabilities
      parameters:
        - description: "Page number for pagination (default: 1)"
          in: query
          name: page
          schema:
            type: integer
        - description: "Number of items per page (default: 25, max: 100)"
          in: query
          name: page_size
          schema:
            type: integer
        - description: "Sort field and direction (e.g., 'name:asc', 'created_at:desc').
            Available fields: name, driver, created_at, size_bytes, type,
            status, compose_project, containers"
          in: query
          name: sort
          schema:
            type: string
        - description: Search query to filter volumes by name
          in: query
          name: q
          schema:
            type: string
        - description: Filter by volume driver
          in: query
          name: driver
          schema:
            type: string
            enum:
              - local
              - nfs
              - cifs
              - overlay2
        - description: Filter orphaned volumes (not attached to any container)
          in: query
          name: orphaned
          schema:
            type: boolean
        - description: "Include system volumes (default: false)"
          in: query
          name: system
          schema:
            type: boolean
        - description: Filter volumes created after date (RFC3339 format)
          in: query
          name: created_after
          schema:
            type: string
        - description: Filter volumes created before date (RFC3339 format)
          in: query
          name: created_before
          schema:
            type: string
      responses:
        "200":
