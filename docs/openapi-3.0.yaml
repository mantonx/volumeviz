openapi: 3.0.0
info:
  contact:
    email: support@volumeviz.io
    name: API Support
    url: https://github.com/mantonx/volumeviz/issues
  description: >-
    Docker volume monitoring API with comprehensive volume discovery, size
    calculation, and container attachment tracking. Focus on user-mounted
    volumes only.


    ## Volume-First Approach

    - Automatic discovery and filtering of user-mounted volumes

    - Excludes Docker infrastructure volumes (container filesystems, tmp volumes)

    - Real-time volume usage monitoring and size calculation

    - Container attachment tracking for each volume


    ## Features

    - Multi-method volume size calculation (du, find, stat)

    - Asynchronous scanning with progress tracking for large volumes

    - Real-time WebSocket progress updates during scan operations

    - High-performance caching with TTL-based invalidation

    - Comprehensive Prometheus metrics integration

    - Circuit breaker patterns for resilience


    ## WebSocket API

    WebSocket endpoint: `ws://localhost:8080/ws`


    ### Scan Progress Events

    Subscribe to real-time scan progress updates:

    ```json

    {

    "type": "subscribe",

    "event": "scan_progress",

    "data": {

    "volume_id": "volume_id_here",

    "scan_id": "scan_id_here"

    }

    }

    ```


    Progress updates are broadcast as:

    ```json

    {

    "type": "scan_progress_update",

    "data": {

    "scan_id": "scan_id",

    "volume_id": "volume_id",

    "overall_status": "running|completed|failed",

    "overall_progress": 75,

    "phases": [

    {

    "phase_name": "volume_scan",

    "status": "completed",

    "progress": 100,

    "items_processed": 1,

    "items_total": 1

    },

    {

    "phase_name": "filesystem_indexing",

    "status": "running",

    "progress": 50,

    "items_processed": 5000,

    "items_total": 10000,

    "items_per_second": 125.5,

    "current_item": "/path/to/current/file"

    },

    {

    "phase_name": "media_enrichment",

    "status": "pending",

    "progress": 0

    }

    ],

    "errors": []

    }

    }

    ```


    ## Performance SLO

    - 95th percentile response time < 500ms for volume listing

    - Supports 1000+ volumes with concurrent access

    - Memory usage < 100MB during large volume scans
