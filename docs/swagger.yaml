        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
      summary: Create alert destination
      tags:
      - alerts
  /alerts/destinations/{id}:
