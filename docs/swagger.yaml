paths:
  /alerts:
    get:
      consumes:
      - application/json
      description: Get a list of alerts with pagination and filtering
      parameters:
      - description: 'Number of items to return (default: 50, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      - description: Filter by status (firing, resolved)
        in: query
        name: status
        type: string
      - description: Filter by rule ID
        in: query
        name: rule_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
      summary: List alerts
      tags:
      - alerts
  /alerts/{id}:
    get:
      consumes:
      - application/json
      description: Get a specific alert by ID
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.Alert'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
      summary: Get alert
      tags:
      - alerts
  /alerts/deliveries:
    get:
      consumes:
      - application/json
      description: Get delivery history with pagination and filtering
      parameters:
      - description: 'Number of items to return (default: 50, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      - description: Filter by alert ID
        in: query
        name: alert_id
        type: integer
      - description: Filter by destination ID
        in: query
        name: destination_id
        type: integer
      - description: Filter by delivery status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
      summary: Get delivery history
      tags:
      - alerts
  /alerts/destinations:
    get:
      consumes:
      - application/json
      description: Get a list of alert destinations with pagination
      parameters:
      - description: 'Number of items to return (default: 50, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      - description: Filter by enabled status
        in: query
        name: enabled
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_mantonx_volumeviz_internal_models.ErrorResponse'
      summary: List alert destinations
      tags:
      - alerts
    post:
