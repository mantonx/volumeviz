name: Backend CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  go:
    name: Go Build, Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: volumeviz
          POSTGRES_PASSWORD: volumeviz
          POSTGRES_DB: volumeviz
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      - name: Validate sqlc generated code
        run: |
          set -euo pipefail
          echo "🔍 Validating sqlc generated code..."
          
          # Generate fresh sqlc code
          make sqlc
          
          # Check if any files changed (indicating generated code was out of sync)
          if ! git diff --quiet --exit-code internal/store/sqlc/; then
            echo "❌ Generated sqlc code is out of sync!"
            echo "The following files have changes:"
            git diff --name-only internal/store/sqlc/
            echo ""
            echo "Please run 'make sqlc' and commit the updated generated code."
            echo "Generated code should always be in sync with query files."
            exit 1
          else
            echo "✅ Generated sqlc code is up to date"
          fi

      - name: Build
        run: go build -v ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m --verbose

      - name: Run tests with race detection and coverage
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: volumeviz
          DB_PASSWORD: volumeviz
          DB_NAME: volumeviz
        run: |
          set -euo pipefail
          go test -race -covermode=atomic -coverprofile=coverage.out -v ./...

      - name: Enforce coverage threshold (60%)
        run: |
          set -euo pipefail
          echo "📊 Analyzing test coverage..."
          pct=$(go tool cover -func=coverage.out | awk '/total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${pct}%"
          echo ""
          echo "Coverage by package:"
          go tool cover -func=coverage.out | grep -v "total:" | sort -k3 -nr
          echo ""
          awk -v p="$pct" 'BEGIN {
            if (p+0 < 60) {
              print "❌ Coverage below minimum threshold"
              print "   Required: ≥60%"
              print "   Actual:   " p "%"
              print "   Gap:      " (60 - p) "%"
              print ""
              print "Please add tests to improve coverage before merging."
              print "Focus on packages with lower coverage shown above."
              exit 1
            } else {
              print "✅ Coverage meets threshold: " p "% (≥60%)"
              if (p+0 >= 80) {
                print "🌟 Excellent coverage!"
              } else if (p+0 >= 70) {
                print "👍 Good coverage!"
              }
            }
          }'

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.out
          retention-days: 30

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-html
          path: coverage.html
          retention-days: 30

      - name: Verify database connection and run migrations
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: volumeviz
          DB_PASSWORD: volumeviz
          DB_NAME: volumeviz
          DB_SSLMODE: disable
          PGPASSWORD: volumeviz
        run: |
          set -euo pipefail
          echo "🔍 Verifying PostgreSQL connection..."
          
          # Wait for PostgreSQL to be fully ready
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            if psql -h localhost -p 5432 -U volumeviz -d volumeviz -c "SELECT 1;" >/dev/null 2>&1; then
              echo "✅ PostgreSQL connection successful"
              break
            fi
            echo "⏳ Waiting for PostgreSQL... (attempt $attempt/$max_attempts)"
            sleep 2
            attempt=$((attempt + 1))
          done
          
          if [ $attempt -gt $max_attempts ]; then
            echo "❌ Failed to connect to PostgreSQL after $max_attempts attempts"
            echo "🔍 Debugging information:"
            echo "PostgreSQL processes:"
            ps aux | grep postgres || echo "No postgres processes found"
            echo "Network connections:"
            netstat -tlnp | grep 5432 || echo "Port 5432 not listening"
            echo "Trying basic connection:"
            psql -h localhost -p 5432 -U volumeviz -d volumeviz -c "SELECT version();" || echo "Connection failed"
            exit 1
          fi
          
          echo "🔧 Running database migrations..."
          go run ./cmd/migrate up

      - name: Seed database for smoke checks (optional)
        if: always()
        env:
          PGPASSWORD: volumeviz
        run: |
          set -euo pipefail
          if [[ -f "scripts/seed.sql" ]]; then
            echo "🌱 Seeding database with test data..."
            psql -h localhost -p 5432 -U volumeviz -d volumeviz -v ON_ERROR_STOP=1 -f scripts/seed.sql || {
              echo "⚠️  Database seeding failed - this is non-critical for smoke tests"
              echo "Continuing without seed data..."
            }
          else
            echo "ℹ️  No seed file found, skipping database seeding"
          fi

      - name: Smoke test - API endpoints
        if: always()
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: volumeviz
          DB_PASSWORD: volumeviz
          DB_NAME: volumeviz
          DB_SSLMODE: disable
          LOG_LEVEL: info
          CI: true
          # Use dynamic port to avoid conflicts
          API_PORT: 0
          SMOKE_TIMEOUT: 60
          HEALTH_RETRIES: 30
          AUTH_ENABLED: false
          RATE_LIMIT_ENABLED: false
          # Disable Docker events in CI environment
          EVENTS_ENABLED: false
        run: |
          set -euo pipefail
          echo "🚀 Running smoke tests..."
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh
