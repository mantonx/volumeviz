name: volumeviz-monitoring

services:
  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: volumeviz-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - volumeviz
    restart: unless-stopped
    labels:
      - "com.volumeviz.service=monitoring"
      - "com.volumeviz.component=prometheus"

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: volumeviz-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - volumeviz
    depends_on:
      - prometheus
    restart: unless-stopped
    labels:
      - "com.volumeviz.service=monitoring"
      - "com.volumeviz.component=grafana"

  # Node exporter for host metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: volumeviz-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - volumeviz
    restart: unless-stopped
    labels:
      - "com.volumeviz.service=monitoring"
      - "com.volumeviz.component=node-exporter"

  # cAdvisor for container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: volumeviz-cadvisor
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /cgroup:/cgroup:ro
    ports:
      - "8083:8080"
    networks:
      - volumeviz
    restart: unless-stopped
    labels:
      - "com.volumeviz.service=monitoring"
      - "com.volumeviz.component=cadvisor"

  # pgAdmin for PostgreSQL monitoring
  pgadmin:
    image: dpage/pgadmin4
    container_name: volumeviz-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@volumeviz.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    ports:
      - "5050:80"
    networks:
      - volumeviz
    restart: unless-stopped
    labels:
      - "com.volumeviz.service=monitoring"
      - "com.volumeviz.component=pgadmin"

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  volumeviz:
    external: true