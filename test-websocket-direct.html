<!DOCTYPE html>
<html>
<head>
    <title>Direct WebSocket Test - No React</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #log { background: #000; color: #0f0; padding: 10px; height: 400px; overflow-y: auto; font-family: monospace; }
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Direct WebSocket Test (No React)</h1>
    <button onclick="connect()">🔌 Connect WebSocket</button>
    <button onclick="clearLog()">🧹 Clear Log</button>
    <div id="log"></div>

    <script>
        let ws = null;
        const log = document.getElementById('log');

        function logMessage(msg) {
            const timestamp = new Date().toISOString();
            const logLine = `[${timestamp}] ${msg}`;
            log.innerHTML += logLine + '<br>';
            log.scrollTop = log.scrollHeight;
            console.log(logLine);
        }

        function connect() {
            if (ws) {
                ws.close();
            }

            logMessage('🔗 Connecting to ws://localhost:8080/api/v1/ws...');
            ws = new WebSocket('ws://localhost:8080/api/v1/ws');

            ws.onopen = () => {
                logMessage('✅ WebSocket connected! ReadyState: ' + ws.readyState);
                
                // Send subscription immediately
                const msg = {
                    action: 'subscribe',
                    event: 'scan.progress',
                    filters: {}
                };
                ws.send(JSON.stringify(msg));
                logMessage('📤 Sent subscription: ' + JSON.stringify(msg));
            };

            ws.onmessage = (event) => {
                logMessage('📥 Received: ' + event.data);
            };

            ws.onerror = (error) => {
                logMessage('❌ WebSocket error: ' + JSON.stringify(error));
            };

            ws.onclose = (event) => {
                logMessage('🔌 WebSocket closed: ' + event.code + ' ' + event.reason);
            };
        }

        function clearLog() {
            log.innerHTML = '';
        }

        // Auto-connect when page loads
        window.onload = () => {
            connect();
        };
    </script>
</body>
</html>
