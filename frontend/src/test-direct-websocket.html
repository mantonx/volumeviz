<!DOCTYPE html>
<html>
<head><title>Direct WebSocket Test</title></head>
<body>
    <h1>Direct WebSocket Test</h1>
    <div id="output"></div>
    <script>
        const output = document.getElementById('output');
        function log(msg) {
            output.innerHTML += new Date().toISOString() + ': ' + msg + '<br>';
            console.log(msg);
        }

        log('Connecting to ws://localhost:8080/api/v1/ws');
        const ws = new WebSocket('ws://localhost:8080/api/v1/ws');

        ws.onopen = () => {
            log('✅ CONNECTED');
            ws.send(JSON.stringify({action: 'subscribe', event: 'scan.progress', filters: {}}));
            log('📤 Subscribed to scan.progress');
        };

        ws.onmessage = (e) => {
            log('📥 ' + e.data);
        };

        ws.onerror = (e) => {
            log('❌ ERROR: ' + JSON.stringify(e));
        };

        ws.onclose = (e) => {
            log('🔌 CLOSED: ' + e.code + ' ' + e.reason);
        };
    </script>
</body>
</html>
